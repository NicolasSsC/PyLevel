# ==============================================================================
# SonarQube Cloud Configuration - PyLevel
# ==============================================================================

sonar.projectKey=Santi234wa_PyLevel
sonar.organization=santi234wa
sonar.projectName=PyLevel
sonar.sourceEncoding=UTF-8

# Codigo fuente a analizar
sonar.sources=pyLevel/src
sonar.tests=pyLevel/tests
sonar.test.inclusions=pyLevel/tests/**/*.ts,pyLevel/tests/**/*.mjs

# Exclusiones de analisis
sonar.exclusions=**/node_modules/**,pyLevel/dist/**,pyLevel/.astro/**,pyLevel/public/**,outputs/**,**/*.png,**/*.xlsx,**/*.tflite,**/*.json

# Reporte de cobertura de pruebas (LCOV)
sonar.javascript.lcov.reportPaths=lcov.info

# ==============================================================================
# SonarQube Cloud Configuration - PyLevel
# ==============================================================================

sonar.projectKey=Santi234wa_PyLevel
sonar.organization=santi234wa
sonar.projectName=PyLevel
sonar.sourceEncoding=UTF-8

# Codigo fuente a analizar
sonar.sources=pyLevel/src
sonar.tests=pyLevel/tests
sonar.test.inclusions=pyLevel/tests/**/*.ts,pyLevel/tests/**/*.mjs

# Exclusiones generales de analisis
sonar.exclusions=**/node_modules/**,pyLevel/dist/**,pyLevel/.astro/**,pyLevel/public/**,outputs/**,**/*.png,**/*.xlsx,**/*.tflite,**/*.json

# Exclusiones de cobertura de pruebas unitarias:
# Las plantillas visuales Astro (HTML/CSS), páginas y servicios de IA se excluyen de la métrica de cobertura unitaria
sonar.coverage.exclusions=**/*.astro,pyLevel/src/pages/**,pyLevel/src/components/**,pyLevel/src/ai/**

# Reporte de cobertura de pruebas unitarias
sonar.javascript.lcov.reportPaths=pyLevel/coverage/lcov.info
# Supresion de falsos positivos
sonar.issue.ignore.multicriteria=e1,e2
# Contraseñas dummy utilizadas en pruebas de integración
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=pyLevel/tests/**
# Ejecución de comandos del sistema en el servidor de sandbox
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e2.resourceKey=pyLevel/src/core/server.mjs
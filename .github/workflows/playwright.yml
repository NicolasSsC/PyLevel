name: Playwright E2E

on:
  push:
    branches: [main, feat/pre-main]
  pull_request:
    branches: [main, feat/pre-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-api:
    name: Runner API authentication and queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements-api.txt
      - run: python -m pip install -r runner/requirements-api.txt
      - run: python -m unittest discover -s runner -p test_api.py -v
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pyLevel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pyLevel/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check types
        run: npm run check -- --minimumSeverity error
      - name: Run unit tests
        run: npm test
      - name: Run browser tests
        run: npm run test:e2e
      - name: Save report and failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            pyLevel/playwright-report/
            pyLevel/test-results/
          retention-days: 14

name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Tests and SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pyLevel/package-lock.json

      - name: Install dependencies
        working-directory: pyLevel
        run: npm ci

      - name: Run Tests with Coverage
        working-directory: pyLevel
        run: npx c8 --reporter=lcov --reporter=text --reports-dir=coverage npm test

      - name: Verify Coverage Report
        run: test -s pyLevel/coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}